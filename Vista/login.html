<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CLUB ACERIAS</title>
    <link rel="stylesheet" href="./Assets/css/estilos.css">
</head>


<body>

    <div>
        <h2>INICIAR SESION</h2>

        <form id="formlogin" action="" method="post">

            <div class="grupo-input">
                <label>Ingresar el Email:</label>
                <input type="email" id="email" required placeholder="ingrese su correo electronico">
            </div class="grupo-input">

            <div class="grupo-input">
                <label>Ingresar Contraseña:</label>
                <input type="password" id="contraseña" required placeholder="ingrese su contraseña">
            </div>

            <div class="grupo-botones">
                <button type="submit">Iniciar Sesion</button>
            </div>
            <div class="crear-cuenta">
                <p>¿No tienes una cuenta? <a href="Registro.html">Crear cuenta</a></p>
            </div>

        </form>

    </div>

</body>

<script src="../Controlador/login.js"></script>
</html>
