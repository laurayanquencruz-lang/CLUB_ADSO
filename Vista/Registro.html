<!DOCTYPE html>
<html lang="es">
<!-- ================= CABECERA: ESTILOS Y TEMA ROSADO (ASOCIADOS) ================= -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assests/encabezado.css?v=3">
    <title>Gestión de Asociados - MR CLUB</title>
    <style>
        /* Colores específicos de botones y título para el módulo de Asociados */
        body { background-color: #f8f9fa; }
        .titulo { color: #da106b; }
        .btn-primario { background-color: #e30e72; color: white; border: none; }
        .btn-primario:hover { background-color: #b80b5b; color: white; }
        .btn-secundario { background-color: #6c757d; color: white; border: none; }
        .btn-secundario:hover { background-color: #5c636a; color: white; }
    </style>
</head>
<body class="tema-rosa">
    <!-- PARTE 1: Encabezado compartido adaptado al rol (Administrador o Asociado) -->
    <div id="encabezado-app"></div>

    <!-- PARTE 2: Contenedor principal (izquierda formulario vertical, derecha tabla de asociados) -->
    <div class="container-fluid px-4 py-4">
        <div class="row g-4 align-items-start">
            <!-- PARTE 2A (Izquierda): Formulario para crear o editar asociados (solo visible para Admin) -->
            <div class="col-12 col-lg-4" id="contenedorFormAsociado">
                <div class="card form-modulo-card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0 fw-bold titulo" id="tituloFormAsociado">Registro de Asociados</h4>
                            <a href="dashboard.html" class="text-decoration-none fw-semibold small" style="color: #b37575;">← Panel</a>
                        </div>

                        <form id="formRegistroAsociado" action="../Modelo/gestionAsociados.php" method="POST">
                            <input type="hidden" id="idAsociado" name="idAsociado">

                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="documento">Documento de Identidad</label>
                                    <input type="number" id="documento" name="Documento" class="form-control" required placeholder="Ej: 1058354573">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="nombres">Nombres</label>
                                    <input type="text" id="nombres" name="Nombre" class="form-control" required placeholder="Nombres completos">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="apellidos">Apellidos</label>
                                    <input type="text" id="apellidos" name="Apellido" class="form-control" required placeholder="Apellidos completos">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="fechaNacimiento">Fecha de Nacimiento</label>
                                    <input type="date" id="fechaNacimiento" name="Fecha_Nacimiento" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="direccion">Dirección de Residencia</label>
                                    <input type="text" id="direccion" name="Direccion_Residencia" class="form-control" required placeholder="Ej: Cra 25 # 11-105">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="telefono">Teléfono</label>
                                    <input type="tel" id="telefono" name="Telefono" class="form-control" required placeholder="Ej: 3225817510">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="ciudad">Ciudad</label>
                                    <select id="ciudad" name="Ciudad" class="form-select" required>
                                        <option value="">Seleccione una ciudad</option>
                                        <option value="Duitama">Duitama</option>
                                        <option value="Sogamoso">Sogamoso</option>
                                        <option value="Tunja">Tunja</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="correo">Correo Electrónico</label>
                                    <input type="email" id="correo" name="Email" class="form-control" required placeholder="correo@ejemplo.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold d-block">Género</label>
                                    <div class="d-flex gap-3 pt-1">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="Genero" id="FEMENINO" value="FEMENINO" required>
                                            <label class="form-check-label" for="FEMENINO">Femenino</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="Genero" id="MASCULINO" value="MASCULINO">
                                            <label class="form-check-label" for="MASCULINO">Masculino</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" name="Genero" id="OTRO" value="OTRO">
                                            <label class="form-check-label" for="OTRO">Otro</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="rolAsociado">Rol</label>
                                    <select id="rolAsociado" name="rol" class="form-select">
                                        <option value="Asociado">Asociado</option>
                                        <option value="Admin">Admin</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="contraseña">Contraseña</label>
                                    <input type="password" id="contraseña" name="Contraseña" class="form-control" required placeholder="Ingrese su contraseña">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold" for="confirmarContraseña">Confirmar Contraseña</label>
                                    <input type="password" id="confirmarContraseña" name="ConfirmarContraseña" class="form-control" required placeholder="Confirme su contraseña">
                                </div>

                                <div class="col-12">
                                    <div id="mensajeRegistro" class="d-none alert mb-0 fw-semibold" role="status" aria-live="polite"></div>
                                </div>

                                <div class="col-12 d-grid gap-2 mt-2">
                                    <button type="submit" id="btnGuardarAsociado" class="btn btn-primario py-2 fw-semibold">
                                        <i class="bi bi-person-plus me-1"></i> Guardar Asociado
                                    </button>
                                    <button type="button" id="btnCancelarAsociado" class="btn btn-secundario py-2 d-none">
                                        <i class="bi bi-x-circle me-1"></i> Cancelar edición
                                    </button>
                                    <button type="reset" id="btnLimpiarAsociado" class="btn btn-outline-secondary py-2">Limpiar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- PARTE 2B (Derecha): Tabla con los asociados guardados en MySQL -->
            <div class="col-12 col-lg-8" id="contenedorTablaAsociado">
                <div class="card tabla-modulo-card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold titulo"><i class="bi bi-people me-2"></i> Asociados Registrados</h5>
                        <button type="button" id="btnRecargarAsociados" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-arrow-clockwise me-1"></i> Actualizar lista
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Documento</th>
                                        <th>Nombre</th>
                                        <th>Ciudad</th>
                                        <th>Teléfono</th>
                                        <th>Correo</th>
                                        <th>Rol</th>
                                        <th id="colAccionesAsociados" class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAsociados">
                                    <tr>
                                        <td colspan="7" class="text-center py-4 text-muted">Cargando asociados...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PARTE 3: Scripts de Bootstrap, encabezado compartido y controlador CRUD de asociados -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/encabezado.js?v=2"></script>
    <script src="../Controlador/Asociado.js?v=3"></script>
</body>
</html>
