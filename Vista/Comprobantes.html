<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Comprobante de Pago - MR CLUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assests/encabezado.css?v=5">
    <style>
        .preview-comprobante {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 10px;
            border: 2px dashed #1b6b66;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 6px;
        }
        .miniatura-comprobante {
            width: 68px;
            height: 68px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #1b6b66;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .miniatura-comprobante:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body class="tema-menta">
    <!-- Encabezado compartido -->
    <div id="encabezado-app"></div>

    <div class="container-fluid px-4 py-4">
        <div class="row g-4 align-items-start">
            <!-- Columna izquierda: formulario vertical para subir foto y mensaje -->
            <div class="col-12 col-lg-4">
                <div class="card form-modulo-card shadow-sm border-0">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-cloud-arrow-up-fill me-2"></i> Subir Comprobante de Pago</h5>
                        <a href="dashboard.html" class="btn btn-sm btn-outline-light">← Panel</a>
                    </div>
                    <div class="card-body p-4">
                        <form id="formComprobante" novalidate>
                            <div class="row g-3">
                                <!-- Aviso visible cuando llega desde el botón "Abonar" de un préstamo específico -->
                                <div class="col-12 d-none" id="bannerPrestamoSeleccionado">
                                    <div class="alert alert-info mb-0 py-2 fw-semibold">
                                        <i class="bi bi-bank me-1"></i> <span id="textoPrestamoSeleccionado"></span>
                                    </div>
                                </div>

                                <!-- Selector de préstamo al que corresponde el abono -->
                                <div class="col-12">
                                    <label for="prestamoComprobante" class="form-label fw-semibold">¿A qué préstamo corresponde el abono?</label>
                                    <select id="prestamoComprobante" name="idPrestamo" class="form-select">
                                        <option value="">Pago general (sin préstamo específico)</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label for="fotoComprobante" class="form-label fw-semibold">Foto del Comprobante</label>
                                    <input type="file" id="fotoComprobante" name="foto" class="form-control" accept="image/jpeg,image/png,image/webp,image/gif" required>
                                    <small class="text-muted">JPG, PNG, WEBP o GIF (máx. 5 MB).</small>
                                </div>

                                <!-- Vista previa de la foto seleccionada -->
                                <div class="col-12 d-none" id="wrapPreviewComprobante">
                                    <img id="previewComprobante" class="preview-comprobante" src="" alt="Vista previa del comprobante">
                                </div>

                                <div class="col-12">
                                    <label for="mensajeComprobante" class="form-label fw-semibold">Mensaje para el Administrador</label>
                                    <textarea id="mensajeComprobante" name="mensaje" class="form-control" rows="4" required placeholder="Ej. Adjunto comprobante de transferencia Nequi por $50.000 de cuota mensual..."></textarea>
                                </div>

                                <div class="col-12">
                                    <div id="mensajeEstadoComprobante" class="d-none alert mb-0 fw-semibold" role="alert"></div>
                                </div>

                                <div class="col-12 d-grid mt-2">
                                    <button type="submit" id="btnEnviarComprobante" class="btn py-2 fw-bold" style="background-color: #1b6b66; color: #fff; border: 2px solid #12524d;">
                                        <i class="bi bi-send-fill me-2"></i> Enviar Comprobante
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna derecha: historial de comprobantes enviados por este asociado -->
            <div class="col-12 col-lg-8">
                <div class="card tabla-modulo-card shadow-sm border-0">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-receipt-cutoff me-2"></i> Mis Comprobantes Enviados</h5>
                        <button type="button" id="btnRecargarComprobantes" class="btn btn-sm btn-outline-dark fw-semibold">
                            <i class="bi bi-arrow-clockwise me-1"></i> Actualizar lista
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Préstamo</th>
                                        <th>Foto</th>
                                        <th>Mensaje</th>
                                        <th class="text-center">Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaMisComprobantes">
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-muted">Cargando comprobantes...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para ver la foto del comprobante en grande -->
    <div class="modal fade" id="modalVerFoto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Comprobante de Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="imgModalComprobante" src="" alt="Comprobante" class="img-fluid rounded">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/encabezado.js?v=4"></script>
    <script src="../Controlador/Comprobantes.js?v=1"></script>
</body>
</html>
