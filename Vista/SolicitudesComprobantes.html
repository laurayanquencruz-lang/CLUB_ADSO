<!DOCTYPE html>
<html lang="es">
<!-- ================= CABECERA: ESTILOS Y TEMA ROSADO (SOLICITUDES DE COMPROBANTE) ================= -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Comprobante - MR CLUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assests/encabezado.css?v=5">
    <style>
        /* Miniatura de cada comprobante recibido; al hacer clic abre el modal en tamaño grande */
        .miniatura-solicitud {
            width: 78px;
            height: 78px;
            object-fit: cover;
            border-radius: 10px;
            border: 2.5px solid #9c2b5d;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .miniatura-solicitud:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body class="tema-rosa">
    <!-- PARTE 1: Encabezado compartido con contador de solicitudes pendientes -->
    <div id="encabezado-app"></div>

    <!-- PARTE 2: Tabla principal de solicitudes recibidas (asociado, préstamo, fecha, foto, mensaje y estado) -->
    <div class="container-fluid px-4 py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-11">
                <div class="card tabla-modulo-card shadow-sm border-0">
                    <div class="card-header py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-inbox-fill me-2"></i> Solicitudes de Comprobante de Pago</h5>
                            <span id="badgePendientesPagina" class="badge rounded-pill bg-danger fs-6 px-3">0 pendientes</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" id="btnRecargarSolicitudes" class="btn btn-sm btn-outline-dark fw-semibold">
                                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar lista
                            </button>
                            <a href="dashboard.html" class="btn btn-sm btn-dark">← Volver al Panel</a>
                        </div>
                    </div>

                    <div class="card-body p-3">
                        <div id="mensajeSolicitudes" class="d-none alert mb-3 fw-semibold" role="alert"></div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Asociado</th>
                                        <th>Préstamo al que Abona</th>
                                        <th>Fecha de Envío</th>
                                        <th>Foto Comprobante</th>
                                        <th>Mensaje</th>
                                        <th class="text-center">Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaSolicitudesComprobantes">
                                    <tr>
                                        <td colspan="7" class="text-center py-4 text-muted">Cargando solicitudes...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para inspeccionar la foto del comprobante en tamaño completo -->
    <div class="modal fade" id="modalVerSolicitud" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="tituloModalSolicitud">Comprobante de Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="imgModalSolicitud" src="" alt="Comprobante de pago" class="img-fluid rounded mb-3">
                    <p id="mensajeModalSolicitud" class="mb-0 fw-semibold text-start bg-light p-3 rounded border"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controlador/encabezado.js?v=4"></script>
    <script src="../Controlador/SolicitudesComprobantes.js?v=1"></script>
</body>
</html>
